<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#08080A" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Coach Cam</title>
    <link rel="preload" href="/cam/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/cam/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/cam/cam.css" />
  </head>
  <body>
    <div class="cam" id="cam" data-state="idle">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="vf" class="vf" aria-label="Viewfinder"></canvas>
      <div class="scrim scrim-top" aria-hidden="true"></div>
      <div class="scrim scrim-bottom" aria-hidden="true"></div>
      <div class="hud" id="hud" aria-hidden="true"></div>
      <div class="flash" id="flash"></div>

      <header class="top">
        <button class="pill status" id="engine" aria-label="Coach status. Tap to switch engine, hold for details">
          <span class="dot" id="dot"></span>
          <span class="status-label" id="engine-name">LIVE</span>
        </button>
        <div class="pill readout" id="readout" role="status" aria-label="Camera settings"></div>
        <button class="btn round glass flip" id="flip" aria-label="Switch camera" hidden>
          <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9" /><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9" /><path d="M18.6 2.6v3.9h-3.9" /><path d="M5.4 21.4v-3.9h3.9" /></svg>
        </button>
      </header>

      <div class="intent" id="intent" aria-hidden="true">
        <span class="intent-disc"><svg viewBox="0 0 24 24"></svg></span><span class="intent-text"></span>
      </div>
      <div class="caption" id="caption" aria-hidden="true"><i class="cap-dot"></i><span class="cap-text"></span></div>
      <div class="said" id="said" aria-hidden="true">
        <svg viewBox="0 0 18 18"><path d="M2 7.5v3M5.5 5v8M9 2.5v13M12.5 6v6M16 8v2" /></svg><q></q>
      </div>

      <footer class="controls" id="controls">
        <div class="modes" id="modes" data-by="user">
          <div class="modes-track" id="modes-track">
            <button data-mode="photo">Photo</button>
            <button data-mode="portrait">Portrait</button>
            <button data-mode="night">Night</button>
            <button data-mode="macro">Macro</button>
            <i class="mode-dot" aria-hidden="true"></i>
          </div>
        </div>
        <div class="row">
          <button class="btn thumb" id="thumb" aria-label="Last photo"><img alt="" /></button>
          <button class="shutter" id="shutter" aria-label="Take photo">
            <span class="shutter-halo"></span>
            <span class="shutter-ring"></span>
            <svg class="shutter-busy" viewBox="0 0 84 84"><circle cx="42" cy="42" r="40.5" pathLength="100" /></svg>
            <span class="shutter-core"></span>
          </button>
          <button class="btn round glass voice" id="voice" aria-label="Coach voice" aria-pressed="false">
            <svg class="mic" viewBox="0 0 24 24"><rect x="9" y="2.8" width="6" height="11.4" rx="3" /><path d="M5.6 11.2a6.4 6.4 0 0 0 12.8 0" /><path d="M12 17.6v3.4" /></svg>
            <span class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </button>
        </div>
      </footer>

      <div class="start" id="start">
        <div class="wordmark">Coach Cam</div>
        <div class="start-block">
          <button class="start-btn" id="start-btn" aria-label="Tap to start">
            <span class="start-core">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M14.31 8l5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16L3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94" /></svg>
            </span>
          </button>
          <div class="start-label" id="start-label">Tap to start</div>
          <div class="start-sub">Camera · Mic · Coach</div>
        </div>
        <div class="start-foot" id="start-foot"><i></i><span>Checking</span></div>
      </div>

      <div class="review" id="review" hidden>
        <div class="review-card" id="review-card">
          <img class="review-img" id="review-img" alt="Last photo" />
          <button class="btn round glass review-back" id="review-back" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg>
          </button>
        </div>
        <div class="review-meta" id="review-meta"></div>
        <div class="review-bar">
          <button class="cta secondary" id="review-share" aria-label="Share">
            <svg viewBox="0 0 24 24"><path d="M12 14.5V3.5M8 7.5l4-4 4 4M8.5 10.5h-2v10h11v-10h-2" /></svg><span>Share</span>
          </button>
          <button class="cta primary" id="review-save" aria-label="Save">
            <svg viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10.5L12 15l4.5-4.5M5.5 20h13" /></svg><span>Save</span>
          </button>
        </div>
      </div>

      <div class="sr-only" id="sr-guide" aria-live="polite"></div>
      <div class="sr-only" id="sr-caption" aria-live="polite"></div>
      <pre class="debug" id="debug" hidden></pre>
    </div>
    <script type="module" src="/src/cam/main.js"></script>
  </body>
</html>
