name: CoachStudio
options:
  bundleIdPrefix: dev.coach
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  CoachKit:
    path: ../CoachKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  CoachStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/CoachStudio
      - path: Resources
        optional: true
    dependencies:
      - package: CoachKit
        product: CoachModels
      - package: CoachKit
        product: CoachAPI
      - package: CoachKit
        product: CoachLive
      - package: CoachKit
        product: CoachEdit
      - package: CoachKit
        product: CoachUI
    info:
      path: Sources/CoachStudio/Info.plist
      properties:
        CFBundleDisplayName: CoachStudio
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "CoachStudio listens while you talk to the editing coach, so you can say things like \"make it warmer\"."
        NSLocalNetworkUsageDescription: "CoachStudio runs Coach Core, which your iPhone reaches over the local network to sync shots."
        NSBonjourServices: ["_coachcore._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coach.studio
        PRODUCT_NAME: CoachStudio
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
