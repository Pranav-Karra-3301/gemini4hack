<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Footer demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        background: #05060b;
        color: #eef3ff;
        font-family: 'Google Sans Flex', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* stands in for the section above: scroll down to bring the sun up */
      .prev {
        height: 150vh;
      }
    </style>
  </head>
  <body>
    <section class="prev"></section>
    <footer id="footer"></footer>
    <script type="module">
      import { mountFooter } from './footer.js';
      window.__footer = mountFooter(document.getElementById('footer'));
    </script>
  </body>
</html>
