<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link preview: og.mp4 and og.jpg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #05060b;
        color: #eef3ff;
        font-family: 'Google Sans Flex', system-ui, sans-serif;
        scrollbar-width: none;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      /* a long section so a scroll position resolves progress finely */
      #lidar {
        height: 20000px;
      }
      /* text-free: no section title, chip or distance labels */
      .ld__head,
      .ld__tags {
        display: none !important;
      }
      .og-look {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .is-still .ld__vignette,
      .is-still .ld__fade {
        display: none;
      }
      .og-ink {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #05060b;
        pointer-events: none;
      }
      .og-mark {
        position: fixed;
        z-index: 11;
        left: 44px;
        bottom: 36px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
      }
      .og-mark svg {
        width: 0.8em;
        height: 0.8em;
        flex: none;
      }
    </style>
  </head>
  <body>
    <section id="lidar"></section>
    <div class="og-ink" style="opacity: 0"></div>
    <div class="og-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="og-spark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4C8DFF" />
            <stop offset="1" stop-color="#9A7CF6" />
          </linearGradient>
        </defs>
        <path
          fill="url(#og-spark)"
          d="M12 0C12.6 6.4 17.6 11.4 24 12C17.6 12.6 12.6 17.6 12 24C11.4 17.6 6.4 12.6 0 12C6.4 11.4 11.4 6.4 12 0Z"
        />
      </svg>
      <span>Heliocam</span>
    </div>
    <script type="module">
      import './og.js';
      await window.og.ready;
      // ?render: render.mjs drives the frames. ?still: hold the poster. Otherwise play the loop.
      const q = new URLSearchParams(location.search);
      if (q.has('still')) window.og.poster();
      else if (!q.has('render')) window.og.play();
    </script>
  </body>
</html>
