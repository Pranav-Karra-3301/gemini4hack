<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awe section demo</title>
    <style>
      html,
      body {
        margin: 0;
        background: #010206;
        color: #eef3ff;
      }
      .filler {
        height: 120vh;
        display: grid;
        place-items: center;
        font: 400 14px/1.4 'Google Sans Flex', system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: rgb(238 243 255 / 0.35);
      }
    </style>
  </head>
  <body>
    <div class="filler">Scroll</div>
    <section id="awe"></section>
    <div class="filler">End of section</div>
    <script type="module">
      import { mountAwe } from './awe.js';
      window.__awe = mountAwe(document.getElementById('awe'));
    </script>
  </body>
</html>
