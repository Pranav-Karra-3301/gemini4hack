<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Device frames demo</title>
  <!-- Stylesheet linked directly; the import map stubs devices.js's CSS import so the demo also runs without Vite. -->
  <link rel="stylesheet" href="./devices.css" />
  <script type="importmap">{ "imports": { "./devices.css": "data:text/javascript," } }</script>
  <style>
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 72px;
      padding: 64px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #ecebe7, #dcdad4);
    }
    .phones { display: flex; gap: 48px; }
    .screen-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #26304d 0%, #121729 45%, #07080e 100%);
    }
  </style>
</head>
<body>
  <div class="phones" id="phones"></div>
  <div id="mac"></div>
  <script type="module">
    import { mountIPhone, mountMacBook } from './devices.js';

    const fill = (screen) => {
      const d = document.createElement('div');
      d.className = 'screen-fill';
      screen.appendChild(d);
      return screen;
    };

    const phones = document.getElementById('phones');
    fill(mountIPhone(phones, { width: 300 }));
    const black = fill(mountIPhone(phones, { width: 300 }));
    black.closest('.dv-iphone').classList.add('dv-iphone--black');

    fill(mountMacBook(document.getElementById('mac'), { width: 1100 }));
  </script>
</body>
</html>
