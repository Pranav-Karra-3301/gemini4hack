<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Showcase demo: Sees in depth / Edits with you</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #070910;
        color: #eef3ff;
        font-family: 'Google Sans Flex', system-ui, sans-serif;
      }
      .pad {
        height: 70vh;
        display: grid;
        place-items: center;
        color: rgba(238, 243, 255, 0.45);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="pad">The previous chapter</div>
    <section id="showcase"></section>
    <div class="pad">The next chapter</div>
    <script type="module">
      import { mountShowcase } from './showcase.js';
      window.__showcase = mountShowcase(document.getElementById('showcase'));
    </script>
  </body>
</html>
