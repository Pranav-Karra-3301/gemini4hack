<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finale demo</title>
    <style>
      html,
      body {
        margin: 0;
        background: #070910;
        color: #eef3ff;
        font-family: 'Google Sans Flex', system-ui, sans-serif;
      }
      .prev {
        position: relative;
        height: 130vh;
        display: grid;
        place-items: center;
        background: #0d1016;
      }
      .prev p {
        margin: 0;
        font-size: clamp(40px, 4.6vw, 68px);
        font-weight: 650;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <section class="prev"><p>The previous chapter</p></section>
    <section id="finale"></section>
    <script type="module">
      import { mountFinale } from './finale.js';
      window.__finale = mountFinale(document.getElementById('finale'));
    </script>
  </body>
</html>
