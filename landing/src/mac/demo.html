<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heliocam Studio on Mac (demo)</title>
  <style>
    html, body { margin: 0; background: #0a0b0f; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px;
      box-sizing: border-box;
    }
    #mac { width: min(1100px, 92vw); }
  </style>
</head>
<body>
  <div id="mac"></div>
  <script type="module">
    import { mountMacSection } from './mac.js';
    window.__mac = await mountMacSection(document.getElementById('mac'));
  </script>
</body>
</html>
