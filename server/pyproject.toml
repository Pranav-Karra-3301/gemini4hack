[project]
name = "lighting-coach-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pillow>=10",
  "numpy>=1.26",
  "torch>=2.15.0",
  "depth-pro-2",
  "transformers>=4.56",
  "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.uv.sources]
depth-pro-2 = { git = "https://github.com/apple-aiml-research/ml-depth-pro-2" }
